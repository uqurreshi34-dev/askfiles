plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fileconverter'
version = '0.1.0'

android {
  namespace "expo.modules.fileconverter"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // No third party dependencies — uses Android built-in BitmapFactory and Bitmap.compress
}
