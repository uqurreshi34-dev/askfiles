plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.storagestats'
version = '0.7.10'

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}
android {
  namespace "expo.modules.storagestats"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}
