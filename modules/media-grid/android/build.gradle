plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.mediagrid'
version = '0.7.10'
android {
  namespace "expo.modules.mediagrid"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
